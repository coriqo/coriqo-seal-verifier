# Publishes coriqo-verify to PyPI when a v* tag is pushed
# (bin/publish-seal-verifier.sh in the main repo pushes one per release).
# Uses PyPI trusted publishing: no token is stored anywhere. The PyPI project
# must list this repository, this workflow file and the "pypi" environment.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Install the package itself with its test extras (pyyaml, jsonschema):
      # this also proves pyproject.toml builds before anything is published.
      - run: pip install ".[test]"
      - run: python -m pytest tests -q
      - name: Tag matches VERIFIER_VERSION
        run: |
          v=$(sed -n 's/^VERIFIER_VERSION = "\(.*\)"$/\1/p' verify_proof.py)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$v"; exit 1; }

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
